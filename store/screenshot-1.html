<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { background: #f4f2ee; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: rgba(0,0,0,.9); }

  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #e0dfdc; }
  .topbar-inner { width: 1128px; height: 100%; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .brand { width: 34px; height: 34px; border-radius: 6px; background: #5f6b76; }
  .search { width: 280px; height: 34px; border-radius: 17px; border: 1px solid #8c8c8c33; background: #edf3f8; display: flex; align-items: center; padding-left: 14px; color: #666; }
  .nav { margin-left: auto; display: flex; height: 100%; }
  .nav-item { width: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #666; }
  .nav-item svg { width: 24px; height: 24px; fill: #666; }
  .nav-item.active { color: #000; box-shadow: inset 0 -2px 0 #000; }
  .nav-item.active svg { fill: #000; }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; background: #7a8fa6; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .layout { width: 1128px; margin: 24px auto 0; display: grid; grid-template-columns: 225px 1fr; gap: 24px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; }
  .cover { height: 58px; background: linear-gradient(120deg, #a0b4b7, #c9d6d8); }
  .profile { padding: 0 16px 16px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid #fff; margin-top: -36px; background: #7a8fa6; color: #fff; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .name { font-size: 18px; font-weight: 600; margin: 10px 0 2px; }
  .headline { font-size: 13px; color: rgba(0,0,0,.75); }
  .loc { font-size: 12px; color: rgba(0,0,0,.55); margin-top: 4px; }
  .stats { margin-top: 8px; padding: 12px 16px; font-size: 12px; font-weight: 600; color: rgba(0,0,0,.6); display: grid; gap: 10px; }
  .stats div { display: flex; justify-content: space-between; }
  .stats b { color: #0a66c2; }
  .links { margin-top: 8px; padding: 12px 16px; font-size: 13px; font-weight: 600; display: grid; gap: 14px; }

  .feed { display: flex; justify-content: center; }
  .message { margin-top: 140px; text-align: center; }
  .message h1 { font-size: 34px; font-weight: 600; line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
  .message p { margin: 14px 0 0; font-size: 16px; color: rgba(0,0,0,.55); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"></div>
      <div class="search">Search</div>
      <div class="nav">
        <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="3"/><path d="M2 20c0-3.6 2.7-6 6-6s6 2.4 6 6zM13.5 20c.2-2.3-.5-4.2-1.8-5.4 1.2-.7 2.6-1.1 4.3-1.1 3 0 5 2.2 5 5v1.5z"/></svg>My Network</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2zm0 3h6V6H9z"/></svg>Jobs</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>Messaging</div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 1 6 6v5l2 3v1H4v-1l2-3V8a6 6 0 0 1 6-6zm-2.5 17h5a2.5 2.5 0 0 1-5 0z"/></svg>Notifications</div>
        <div class="nav-item"><div class="avatar-sm">AR</div>Me</div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <div class="cover"></div>
        <div class="profile">
          <div class="avatar">AR</div>
          <div class="name">Alex Rivera</div>
          <div class="headline">Product Designer</div>
          <div class="loc">Portland, Oregon</div>
        </div>
      </div>
      <div class="card stats">
        <div>Profile viewers <b>24</b></div>
        <div>Post impressions <b>112</b></div>
      </div>
      <div class="card links">
        <div>Saved items</div>
        <div>Groups</div>
        <div>Newsletters</div>
        <div>Events</div>
      </div>
    </div>

    <div class="feed">
      <div class="message">
        <h1>Stop scrolling and do something great.</h1>
      </div>
    </div>
  </div>
</body>
</html>
